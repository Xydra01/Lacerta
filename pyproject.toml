[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lacerta"
version = "0.1.0"
description = "Local-first AI agent framework (Supervisor–Worker)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lacerta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
